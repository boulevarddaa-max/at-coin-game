<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AT COIN</title>

  <!-- Telegram & Supabase -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #0c0a17;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    header {
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 18px;
      font-weight: 900;
      color: #00d2ff;
      letter-spacing: 1px;
    }

    .level-badge {
      background: #1b1633;
      border: 1px solid #2e2654;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 11px;
      color: #a29bfe;
      font-weight: bold;
    }

    .stats-container {
      text-align: center;
      margin-top: 10px;
    }

    .balance-val {
      font-size: 42px;
      font-weight: 900;
      color: #fbc531;
      line-height: 1;
    }

    .balance-label {
      font-size: 11px;
      color: #8c7ae6;
      letter-spacing: 2px;
      margin-top: 5px;
      text-transform: uppercase;
    }

    .sub-stats {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
    }

    .stat-pill {
      background: #15102a;
      border: 1px solid #271f4b;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 11px;
      color: #00d2ff;
    }

    .click-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      position: relative;
    }

    .tap-btn {
      width: 180px;
      height: 180px;
      border-radius: 30px;
      background: radial-gradient(circle, #5f27cd 0%, #341f97 100%);
      box-shadow: 0 0 50px rgba(95, 39, 205, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.05s ease;
      border: 2px solid #8c7ae6;
    }

    .tap-btn:active {
      transform: scale(0.92);
    }

    .tap-btn i {
      font-size: 60px;
      color: #ffffff;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));
    }

    .tap-btn span {
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #00d2ff;
      text-transform: uppercase;
    }

    .status-text {
      position: absolute;
      bottom: 20px;
      font-size: 11px;
      color: #6c5ce7;
    }

    nav {
      background: #090712;
      border-top: 1px solid #1c1636;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #574b90;
      font-size: 9px;
      text-decoration: none;
      cursor: pointer;
      width: 16%;
    }

    .nav-btn.active {
      color: #00d2ff;
    }

    .nav-btn i {
      font-size: 16px;
    }

    .floating-num {
      position: absolute;
      font-weight: 900;
      font-size: 22px;
      color: #00d2ff;
      pointer-events: none;
      animation: floatUp 0.7s ease-out forwards;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-60px); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">AT COIN</div>
    <div class="level-badge">LVL <span id="lvl-val">1</span></div>
  </header>

  <div class="stats-container">
    <div class="balance-val" id="score">0</div>
    <div class="balance-label">AT COINS</div>

    <div class="sub-stats">
      <div class="stat-pill">Сила тапа +<span id="power-val">1</span></div>
      <div class="stat-pill">Предметов <span id="items-val">0</span></div>
    </div>
  </div>

  <div class="click-section">
    <div class="tap-btn" id="tap-target">
      <i class="fa-solid fa-atom"></i>
      <span>Tap for loot</span>
    </div>
    <div class="status-text" id="sync-status">Синхронизация...</div>
  </div>

  <nav>
    <div class="nav-btn active"><i class="fa-solid fa-hand-pointer"></i><span>Лут</span></div>
    <div class="nav-btn"><i class="fa-solid fa-boxes-stacked"></i><span>Инвентарь</span></div>
    <div class="nav-btn"><i class="fa-solid fa-hammer"></i><span>Крафт</span></div>
    <div class="nav-btn"><i class="fa-solid fa-bolt"></i><span>Прочка</span></div>
    <div class="nav-btn"><i class="fa-solid fa-store"></i><span>Биржа</span></div>
    <div class="nav-btn"><i class="fa-solid fa-trophy"></i><span>Топ</span></div>
  </nav>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const SUPABASE_URL = 'https://jroakbqcautuleqmctau.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Y2hiGcojW9-6b-vZKs2d1g_Yq1WDqkG';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const user = tg.initDataUnsafe?.user;
    const userId = user ? String(user.id) : 'guest_123';
    const userName = user ? (user.username || user.first_name) : 'Гость';

    let score = 0;
    let clickPower = 1;
    let saveTimeout = null;

    const scoreEl = document.getElementById('score');
    const syncEl = document.getElementById('sync-status');
    const tapTarget = document.getElementById('tap-target');

    async function loadData() {
      syncEl.innerText = "Загрузка...";
      try {
        const { data } = await supabaseClient
          .from('users')
          .select('clicks')
          .eq('telegram_id', userId)
          .single();

        if (data) {
          score = Number(data.clicks) || 0;
        } else {
          await supabaseClient.from('users').insert([{ telegram_id: userId, username: userName, clicks: 0 }]);
        }
        syncEl.innerText = "Сохранено ✓";
      } catch (e) {
        syncEl.innerText = "Готово";
      }
      updateUI();
    }

    function saveProgress() {
      syncEl.innerText = "Сохранение...";
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(async () => {
        try {
          await supabaseClient.from('users').update({ clicks: score, updated_at: new Date() }).eq('telegram_id', userId);
          syncEl.innerText = "Сохранено ✓";
        } catch (e) {
          syncEl.innerText = "Ошибка сохранения";
        }
      }, 1500);
    }

    function updateUI() {
      scoreEl.innerText = score.toLocaleString();
    }

    tapTarget.addEventListener('pointerdown', (e) => {
      score += clickPower;
      updateUI();
      saveProgress();

      const num = document.createElement('div');
      num.className = 'floating-num';
      num.innerText = '+' + clickPower;
      num.style.left = (e.clientX - 10) + 'px';
      num.style.top = (e.clientY - 20) + 'px';
      document.body.appendChild(num);
      setTimeout(() => num.remove(), 700);
    });

    loadData();
  </script>
</body>
</html>
