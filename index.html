<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AT COIN</title>

  <!-- Telegram WebApp SDK & Supabase Client -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }

    body {
      background-color: #0d0e12;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
      padding-bottom: 70px;
    }

    header {
      width: 100%;
      padding: 20px;
      text-align: center;
    }

    .user-info {
      font-size: 14px;
      color: #8a8d9b;
      margin-bottom: 8px;
    }

    .balance-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 36px;
      font-weight: 800;
    }

    .coin-icon-small {
      width: 36px;
      height: 36px;
      background: #f3ba2f;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #0d0e12;
      font-weight: bold;
    }

    .main-game {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      width: 100%;
    }

    .click-area {
      position: relative;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, #f3ba2f 0%, #a87d0e 100%);
      box-shadow: 0 0 30px rgba(243, 186, 47, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.05s ease;
    }

    .click-area:active {
      transform: scale(0.95);
    }

    .click-area-inner {
      font-size: 90px;
      font-weight: 900;
      color: #0d0e12;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    /* Анимация летящих цифр при клике */
    .floating-text {
      position: absolute;
      font-size: 24px;
      font-weight: bold;
      color: #f3ba2f;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-80px) scale(1.2);
      }
    }

    /* Нижнее меню навигации */
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background-color: #16181e;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #23262f;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #8a8d9b;
      font-size: 11px;
      cursor: pointer;
      text-decoration: none;
      width: 25%;
    }

    .nav-item.active {
      color: #f3ba2f;
    }

    .nav-icon {
      font-size: 20px;
    }

    /* Модальные окна для вкладок */
    .tab-content {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% - 60px);
      background-color: #0d0e12;
      padding: 20px;
      overflow-y: auto;
      z-index: 90;
    }

    .tab-content.active {
      display: block;
    }

    .tab-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #f3ba2f;
    }

    .card {
      background: #16181e;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #23262f;
    }

    .btn {
      background: #f3ba2f;
      color: #0d0e12;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:disabled {
      background: #32353e;
      color: #6c707e;
      cursor: not-allowed;
    }

    .status-bar {
      margin-top: 15px;
      font-size: 12px;
      color: #8a8d9b;
    }
  </style>
</head>
<body>

  <!-- Заголовок и баланс -->
  <header>
    <div class="user-info" id="username">Загрузка аккаунта...</div>
    <div class="balance-container">
      <div class="coin-icon-small">AT</div>
      <span id="balance">0</span>
    </div>
    <div class="status-bar" id="save-status">Синхронизация с базой...</div>
  </header>

  <!-- Главный экран кликера -->
  <main class="main-game" id="tab-game">
    <div class="click-area" id="coin">
      <div class="click-area-inner">AT</div>
    </div>
  </main>

  <!-- Вкладка Бусты (Улучшения) -->
  <div class="tab-content" id="tab-boosts">
    <div class="tab-title">Улучшения</div>
    <div class="card">
      <div>
        <h3>Мультиклик</h3>
        <p>+1 к клику (Текущий: +<span id="click-power-val">1</span>)</p>
        <small>Цена: <span id="click-price-val">10</span> AT</small>
      </div>
      <button class="btn" id="buy-click-btn">Прокачать</button>
    </div>
  </div>

  <!-- Вкладка Биржа/Лидеры -->
  <div class="tab-content" id="tab-leaderboard">
    <div class="tab-title">Таблица лидеров</div>
    <div id="leaderboard-list">Загрузка топ-игроков...</div>
  </div>

  <!-- Навигация -->
  <nav>
    <div class="nav-item active" onclick="switchTab('game')">
      <div class="nav-icon">🪙</div>
      <div>Игра</div>
    </div>
    <div class="nav-item" onclick="switchTab('boosts')">
      <div class="nav-icon">⚡</div>
      <div>Бусты</div>
    </div>
    <div class="nav-item" onclick="switchTab('leaderboard')">
      <div class="nav-icon">🏆</div>
      <div>Топ</div>
    </div>
  </nav>

  <script>
    // 1. Инициализация Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.expand();

    // 2. Инициализация Supabase
    const SUPABASE_URL = 'https://jroakbqcautuleqmctau.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Y2hiGcojW9-6b-vZKs2d1g_Yq1WDqkG';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 3. Данные игрока
    const user = tg.initDataUnsafe?.user;
    const userId = user ? String(user.id) : 'guest_' + Math.floor(Math.random() * 10000);
    const userName = user ? (user.username || user.first_name) : 'Гость';

    document.getElementById('username').innerText = userName;

    // Игровое состояние
    let score = 0;
    let clickPower = 1;
    let clickPrice = 10;
    let saveTimeout = null;

    const balanceEl = document.getElementById('balance');
    const coinEl = document.getElementById('coin');
    const statusEl = document.getElementById('save-status');

    // Загрузка данных из Supabase
    async function loadUserData() {
      statusEl.innerText = "Загрузка прогресса...";
      try {
        const { data, error } = await supabaseClient
          .from('users')
          .select('clicks')
          .eq('telegram_id', userId)
          .single();

        if (data) {
          score = Number(data.clicks) || 0;
        } else {
          // Если нового пользователя нет в базе — создаем запись
          await supabaseClient.from('users').insert([
            { telegram_id: userId, username: userName, clicks: 0 }
          ]);
        }
        statusEl.innerText = "Данные синхронизированы";
      } catch (e) {
        statusEl.innerText = "Автономный режим";
      }
      updateUI();
    }

    // Сохранение данных в Supabase (автосохранение раз в 1.5 сек)
    function saveProgress() {
      statusEl.innerText = "Сохранение...";
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(async () => {
        try {
          await supabaseClient
            .from('users')
            .update({ clicks: score, updated_at: new Date() })
            .eq('telegram_id', userId);
          statusEl.innerText = "Сохранено ✓";
        } catch (e) {
          statusEl.innerText = "Ошибка сохранения";
        }
      }, 1500);
    }

    // Обновление интерфейса
    function updateUI() {
      balanceEl.innerText = score.toLocaleString();
      document.getElementById('click-power-val').innerText = clickPower;
      document.getElementById('click-price-val').innerText = clickPrice;
      document.getElementById('buy-click-btn').disabled = score < clickPrice;
    }

    // Обработка клика
    coinEl.addEventListener('pointerdown', (e) => {
      score += clickPower;
      updateUI();
      saveProgress();

      // Эффект всплывающей цифры
      const floatText = document.createElement('div');
      floatText.className = 'floating-text';
      floatText.innerText = '+' + clickPower;
      floatText.style.left = (e.clientX - 10) + 'px';
      floatText.style.top = (e.clientY - 30) + 'px';
      document.body.appendChild(floatText);

      setTimeout(() => floatText.remove(), 800);
    });

    // Покупка апгрейда
    document.getElementById('buy-click-btn').addEventListener('click', () => {
      if (score >= clickPrice) {
        score -= clickPrice;
        clickPower += 1;
        clickPrice = Math.floor(clickPrice * 2);
        updateUI();
        saveProgress();
      }
    });

    // Переключение вкладок
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      if (tabName === 'game') {
        document.querySelectorAll('.nav-item')[0].classList.add('active');
      } else if (tabName === 'boosts') {
        document.getElementById('tab-boosts').classList.add('active');
        document.querySelectorAll('.nav-item')[1].classList.add('active');
      } else if (tabName === 'leaderboard') {
        document.getElementById('tab-leaderboard').classList.add('active');
        document.querySelectorAll('.nav-item')[2].classList.add('active');
        loadLeaderboard();
      }
    }

    // Загрузка таблицы лидеров
    async function loadLeaderboard() {
      const listEl = document.getElementById('leaderboard-list');
      listEl.innerHTML = 'Загрузка...';

      const { data, error } = await supabaseClient
        .from('users')
        .select('username, clicks')
        .order('clicks', { ascending: false })
        .limit(10);

      if (data && data.length > 0) {
        listEl.innerHTML = data.map((item, index) => `
          <div class="card">
            <div><strong>#${index + 1} ${item.username || 'Игрок'}</strong></div>
            <div><strong>${Number(item.clicks).toLocaleString()} AT</strong></div>
          </div>
        `).join('');
      } else {
        listEl.innerHTML = 'Список лидеров пока пуст.';
      }
    }

    // Старт игры при загрузке
    loadUserData();
  </script>
</body>
</html>
